<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centinela · Menarguez-IA Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --brand-bg: #000000;
    --brand-text: #FFFFFF;
    --brand-primary: #0080F0;
    --brand-accent: #FFC300;
    --brand-font: 'Lato', Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--brand-bg);
    color: var(--brand-text);
    font-family: var(--brand-font);
    min-height: 100vh;
    padding: 48px 20px;
  }
  .container { max-width: 720px; margin: 0 auto; }
  header { margin-bottom: 32px; }
  h1 {
    font-weight: 900;
    font-size: 28px;
    letter-spacing: -0.5px;
  }
  h1 span { color: var(--brand-primary); }
  .subtitle {
    color: #999;
    font-size: 14px;
    margin-top: 6px;
  }
  .resumen {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 24px 0 28px;
    padding: 14px 18px;
    border: 1px solid #1a1a1a;
    border-radius: 10px;
    background: #0a0a0a;
    font-size: 15px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .dot.up { background: #22c55e; }
  .dot.down { background: #ef4444; }
  .lista { display: flex; flex-direction: column; gap: 10px; }
  .servicio {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    border: 1px solid #1a1a1a;
    border-radius: 10px;
    background: #0a0a0a;
  }
  .servicio-info { display: flex; align-items: center; gap: 12px; }
  .servicio-nombre { font-weight: 700; font-size: 15px; }
  .servicio-url { color: #777; font-size: 12px; text-decoration: none; }
  .servicio-url:hover { color: var(--brand-primary); }
  .badge {
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .badge.up { background: rgba(34,197,94,0.15); color: #22c55e; }
  .badge.down { background: rgba(239,68,68,0.15); color: #ef4444; }
  footer {
    margin-top: 36px;
    text-align: center;
    font-size: 12px;
    color: #555;
  }
  footer a { color: var(--brand-accent); text-decoration: none; }
  .cargando { color: #777; font-size: 14px; }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Centinela <span>Menarguez-IA</span></h1>
      <p class="subtitle">Monitor externo de disponibilidad — comprobación cada 5 minutos</p>
    </header>

    <div id="resumen" class="resumen">
      <span class="cargando">Cargando estado...</span>
    </div>

    <div id="lista" class="lista"></div>

    <footer>
      Última comprobación: <span id="actualizado">—</span> ·
      <a href="https://github.com/Nachomf112/centinela-menarguez-ia" target="_blank">Ver repositorio</a>
    </footer>
  </div>

<script>
async function cargarEstado() {
  try {
    const res = await fetch('status.json?t=' + Date.now());
    const data = await res.json();

    const fecha = new Date(data.actualizado);
    document.getElementById('actualizado').textContent = fecha.toLocaleString('es-ES', {
      timeZone: 'Europe/Madrid', dateStyle: 'medium', timeStyle: 'short'
    });

    const caidos = data.servicios.filter(s => s.estado === 'down').length;
    const resumen = document.getElementById('resumen');
    if (caidos === 0) {
      resumen.innerHTML = '<span class="dot up"></span> Todos los servicios operativos (' + data.servicios.length + '/' + data.servicios.length + ')';
    } else {
      resumen.innerHTML = '<span class="dot down"></span> ' + caidos + ' de ' + data.servicios.length + ' servicios caídos';
    }

    const lista = document.getElementById('lista');
    lista.innerHTML = data.servicios.map(s => `
      <div class="servicio">
        <div class="servicio-info">
          <span class="dot ${s.estado}"></span>
          <div>
            <div class="servicio-nombre">${s.nombre}</div>
            <a class="servicio-url" href="${s.url}" target="_blank">${s.url.replace('https://','')}</a>
          </div>
        </div>
        <span class="badge ${s.estado}">${s.estado === 'up' ? 'Operativo' : 'Caído · ' + s.codigo}</span>
      </div>
    `).join('');
  } catch (e) {
    document.getElementById('resumen').innerHTML = '<span class="cargando">No se pudo cargar el estado.</span>';
  }
}

cargarEstado();
setInterval(cargarEstado, 60000);
</script>
</body>
</html>
